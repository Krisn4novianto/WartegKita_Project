services:
  postgres:
    image: postgres:18
    container_name: wartegkita-postgres
    restart: always
    environment:
      POSTGRES_DB: wartegkita_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Krisn@12345
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wartegkita-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "Krisn@12345"
      JWT_SECRET: "super-secret-key"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wartegkita-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
